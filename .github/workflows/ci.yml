name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# This repository is public. Never execute fork-controlled pull-request code on
# a persistent self-hosted runner. Fork PRs are intentionally skipped; a
# maintainer can review the patch and test it from a trusted branch instead.

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v5

      - name: Verify runner prerequisites
        run: |
          set -euo pipefail
          command -v docker >/dev/null || { echo 'docker is required on the self-hosted runner' >&2; exit 1; }
          docker compose version >/dev/null || { echo 'docker compose plugin is required on the self-hosted runner' >&2; exit 1; }
          command -v curl >/dev/null || { echo 'curl is required on the self-hosted runner' >&2; exit 1; }
          if ! command -v shellcheck >/dev/null; then
            echo 'shellcheck is required on the self-hosted runner' >&2
            exit 1
          fi

      - name: Shell syntax
        run: |
          bash -n tests/static.sh
          for script in rbs scripts/bootstrap-debian.sh scripts/install-seccomp-profile.sh browser/entrypoint.sh browser/start-browser.sh; do
            if [[ -f "$script" ]]; then bash -n "$script"; fi
          done

      - name: ShellCheck
        run: |
          files=(tests/static.sh)
          for script in rbs scripts/bootstrap-debian.sh scripts/install-seccomp-profile.sh browser/entrypoint.sh browser/start-browser.sh; do
            if [[ -f "$script" ]]; then files+=("$script"); fi
          done
          shellcheck "${files[@]}"

      - name: Static security contract
        run: bash tests/static.sh

      - name: Render Compose configuration
        run: |
          mkdir -p state/accounts/example
          cp config/wireguard.example.conf state/accounts/example/wireguard.conf
          printf '%s' 'ci-only-password' > state/accounts/example/xpra-password
          seccomp_profile="$(./scripts/install-seccomp-profile.sh)"
          ACCOUNT_DIR="$PWD/state/accounts/example" \
            SECCOMP_PROFILE="$seccomp_profile" \
            docker compose --env-file .env.account.example config >/dev/null

  build-browser:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Verify runner prerequisites
        run: |
          set -euo pipefail
          command -v docker >/dev/null || { echo 'docker is required on the self-hosted runner' >&2; exit 1; }
          command -v curl >/dev/null || { echo 'curl is required on the self-hosted runner' >&2; exit 1; }

      - name: Build browser image
        run: docker build --pull -t remote-browser-stack:ci browser

      - name: Smoke test Xpra and Chromium startup
        run: |
          password_file="$(mktemp)"
          seccomp_profile="$(./scripts/install-seccomp-profile.sh)"
          printf '%s' 'ci-only-password' > "$password_file"
          chmod 0600 "$password_file"

          cleanup() {
            docker rm -f rbs-browser-smoke >/dev/null 2>&1 || true
            rm -f "$password_file"
          }
          trap cleanup EXIT

          docker run -d \
            --name rbs-browser-smoke \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --security-opt "seccomp=$seccomp_profile" \
            --shm-size 1g \
            -e START_URL=about:blank \
            -v "$password_file:/run/secrets/xpra_password:ro" \
            remote-browser-stack:ci

          for _ in {1..20}; do
            if [[ "$(docker inspect -f '{{.State.Running}}' rbs-browser-smoke)" != "true" ]]; then
              docker logs rbs-browser-smoke
              exit 1
            fi

            if docker exec rbs-browser-smoke bash -c '
              for file in /proc/[0-9]*/comm; do
                read -r name < "$file" || continue
                [[ "$name" == chromium* ]] && exit 0
              done
              exit 1
            '; then
              exit 0
            fi

            sleep 1
          done

          docker logs rbs-browser-smoke
          echo 'Chromium did not start within the smoke-test window' >&2
          exit 1
