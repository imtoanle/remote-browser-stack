services:
  vpn:
    image: qmcgaw/gluetun:v3.41.1
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: wireguard
      FIREWALL_INPUT_PORTS: "14500"
      TZ: "${TZ:-UTC}"
    volumes:
      - type: bind
        source: "${ACCOUNT_DIR}/wireguard.conf"
        target: /gluetun/wireguard/wg0.conf
        read_only: true
    ports:
      - name: xpra
        target: 14500
        published: "${XPRA_PORT}"
        host_ip: "${XPRA_BIND_IP:-0.0.0.0}"
        protocol: tcp
    restart: unless-stopped

  browser:
    build:
      context: ./browser
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy
    environment:
      START_URL: "${START_URL:-}"
    volumes:
      - browser-profile:/home/browser/profile
    secrets:
      - xpra_password
    shm_size: "1gb"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      # Docker's generated docker-default AppArmor profile blocks Chromium's
      # unprivileged user-namespace sandbox. Disable only this outer LSM layer
      # for the browser; capabilities, NNP, seccomp and Chromium's own sandbox
      # remain enabled. The VPN container keeps Docker's default AppArmor.
      - apparmor=unconfined
      - "seccomp=${SECCOMP_PROFILE}"
    restart: unless-stopped

secrets:
  xpra_password:
    file: "${ACCOUNT_DIR}/xpra-password"

volumes:
  browser-profile:
